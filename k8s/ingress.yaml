apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alphamind-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.alphamind.ai
      secretName: alphamind-tls
  rules:
    - host: api.alphamind.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alphamind-backend-service
                port:
                  number: 80
