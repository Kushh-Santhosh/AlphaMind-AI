name: AlphaMind AI Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project & Dev Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]" || pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy greenlet asyncpg alembic redis httpx structlog python-jose passlib python-multipart langgraph langchain numpy pandas yfinance scipy pytest pytest-asyncio pytest-cov pytest-mock ruff black mypy

      - name: Code Formatting Check (Black)
        run: black --check apps/backend packages

      - name: Linting Check (Ruff)
        run: ruff check apps/backend packages

      - name: Static Type Safety Check (Mypy)
        run: mypy apps/backend/app packages --ignore-missing-imports --explicit-package-bases

      - name: Execute Full PyTest Suite
        run: PYTHONPATH=. pytest -v

  frontend-quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: TypeScript Type-Check
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: Vitest Suite
        working-directory: apps/frontend
        run: npm test -- --run

      - name: Production Frontend Build
        working-directory: apps/frontend
        run: npm run build
