global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'alphamind-backend-staging'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['backend:8000', 'localhost:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
